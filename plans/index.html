<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Планы МОП · Rustrans</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1c33; --red:#e30613; --muted:#5b6b7c; --line:#d9e0ea; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Montserrat,system-ui,sans-serif; color:var(--navy);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(227,6,19,.10), transparent 55%),
        linear-gradient(165deg, #f7f9fc, #e8eef6 55%, #f3f6fa);
      padding:28px 16px;
    }
    .wrap { width:min(720px,100%); margin:0 auto; }
    h1 { margin:0 0 6px; font-size:24px; font-weight:800; letter-spacing:-.03em; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.45; }
    .card {
      background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px;
      box-shadow:0 16px 40px rgba(11,28,51,.06); margin-bottom:14px;
    }
    .field-label {
      display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--muted); margin:0 0 6px;
    }
    input[type=password], input[type=month], input[type=number], button { font:inherit; }
    input[type=password], input[type=month], input[type=number] {
      width:100%; border:1px solid #c9d3e0; border-radius:12px; padding:12px 14px;
      margin-bottom:12px; background:#fbfcfe; font-weight:600;
    }
    input[type=number]:disabled { opacity:.45; background:#eef2f7; }
    .meta {
      display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--muted);
      margin:0 0 14px; padding:10px 12px; background:#f7fafc; border-radius:12px;
    }
    .meta strong { color:var(--navy); }
    .sec { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
    .sec:first-child { border-top:0; padding-top:0; margin-top:0; }
    .sec h3 { margin:0 0 10px; font-size:13px; font-weight:800; }
    .metric {
      border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px;
      background:#fbfcfe;
    }
    .metric.undef { background:#f3f5f8; }
    .metric-head {
      display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between;
      margin-bottom:8px;
    }
    .metric-head .lab { font-size:13px; font-weight:700; }
    .chk {
      display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--muted);
      cursor:pointer; user-select:none;
    }
    .chk input { width:16px; height:16px; accent-color:var(--navy); }
    .mgr {
      display:grid; grid-template-columns:1fr 150px; gap:8px; align-items:center;
      margin-top:6px;
    }
    .mgr .name { font-size:13px; font-weight:700; }
    .mgr input { margin-bottom:0; }
    button {
      width:100%; border:0; border-radius:12px; padding:13px 18px;
      background:var(--navy); color:#fff; font-weight:700; cursor:pointer;
    }
    button.secondary {
      background:#fff; color:var(--navy); border:1px solid #c9d3e0; margin-bottom:12px;
    }
    button:disabled { opacity:.55; cursor:wait; }
    .msg { margin-top:12px; font-size:13px; font-weight:600; display:none; white-space:pre-wrap; }
    .msg.show { display:block; }
    .msg.ok { color:#1b7f4e; }
    .msg.err { color:var(--red); }
    .hint { font-size:12px; color:var(--muted); line-height:1.45; }
    #gate { display:block; }
    #app { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Планы МОП</h1>
    <p class="sub">Пароль → месяц → планы по метрикам РНП. Цвет в РНП = % от плана (норма дня = план ÷ рабочие дни). «План не определён» — без цвета.</p>

    <div class="card" id="gate">
      <div class="field-label">Пароль</div>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button type="button" id="unlock">Войти</button>
      <div class="msg" id="gate-msg"></div>
    </div>

    <div id="app">
      <div class="card">
        <div class="field-label">Месяц</div>
        <input id="month" type="month" />
        <button type="button" class="secondary" id="reload">Загрузить месяц</button>
        <div class="meta" id="meta">—</div>
        <div id="sections"></div>
        <button type="button" id="save">Сохранить</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card hint">
        Форма на GitHub Pages шлёт планы на VPS (<code>/p</code>).
        Файлы в <code>data/warehouse/plans/</code> на сервере; витрина публикуется на GitHub.
      </div>
    </div>
  </div>

    const SECTIONS = [{"title": "KPI 0. Выручка", "metrics": [{"key": "revenue", "label": "Выручка по реализациям, ₽", "kind": "money"}]}, {"title": "KPI 1. Сделки / УПД", "metrics": [{"key": "deals_cnt", "label": "Сделки, шт", "kind": "num"}, {"key": "deals_sum", "label": "Сделки, ₽", "kind": "money"}, {"key": "upd", "label": "УПД, шт", "kind": "num"}]}, {"title": "KPI 2–3. Счета", "metrics": [{"key": "invoices_cnt", "label": "Счета выст., шт", "kind": "num"}, {"key": "invoices_paid_cnt", "label": "Счета опл., шт", "kind": "num"}, {"key": "invoices_sum", "label": "Счета выст., ₽", "kind": "money"}, {"key": "invoices_paid_sum", "label": "Счета опл., ₽", "kind": "money"}]}, {"title": "KPI 4. Лиды", "metrics": [{"key": "leads", "label": "Лиды созданные, шт", "kind": "num"}, {"key": "leads_converted", "label": "Лиды сконвертир., шт", "kind": "num"}]}, {"title": "KPI 5. Договоры", "metrics": [{"key": "contracts_init", "label": "Договоры иниц., шт", "kind": "num"}, {"key": "contracts_signed", "label": "Договоры подп., шт", "kind": "num"}]}, {"title": "KPI 6. Звонки", "metrics": [{"key": "calls", "label": "Звонки, шт", "kind": "num"}, {"key": "calls_30", "label": "Звонки 30–60с, шт", "kind": "num"}, {"key": "calls_60", "label": "Звонки >60с, шт", "kind": "num"}, {"key": "talk_time_sec", "label": "Время на линии, сек (месяц)", "kind": "num"}]}, {"title": "KPI 7. Wazzup", "metrics": [{"key": "wazzup_msg", "label": "Wazzup сообщения, шт", "kind": "num"}, {"key": "wazzup_dlg", "label": "Wazzup диалоги, шт", "kind": "num"}]}, {"title": "KPI 8. Email", "metrics": [{"key": "email_in", "label": "Email вх., шт", "kind": "num"}, {"key": "email_out", "label": "Email исх., шт", "kind": "num"}]}];
    let CFG = null;
    let NW = new Set();
    let PASS = "";

    const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt, iterations:ITERATIONS, hash:"SHA-256" },
        base,
        { name:"AES-GCM", length:256 },
        false,
        ["decrypt"]
      );
    }

    function workDays(ym) {
      const parts = ym.split("-");
      const y = +parts[0], m = +parts[1];
      if (!y || !m) return 0;
      let n = 0;
      const d = new Date(Date.UTC(y, m - 1, 1));
      while (d.getUTCMonth() === m - 1) {
        const iso = d.toISOString().slice(0, 10);
        if (!NW.has(iso)) n += 1;
        d.setUTCDate(d.getUTCDate() + 1);
      }
      return n;
    }

    function show(el, text, ok) {
      el.textContent = text;
      el.className = "msg show " + (ok ? "ok" : "err");
    }

    function allMetricKeys() {
      const keys = [];
      SECTIONS.forEach(s => s.metrics.forEach(m => keys.push(m.key)));
      return keys;
    }

    function normalizePlan(raw) {
      const metrics = {};
      const undef = new Set();
      allMetricKeys().forEach(k => { metrics[k] = {}; });

      if (raw && raw.metrics && typeof raw.metrics === "object") {
        Object.keys(raw.metrics).forEach(k => {
          metrics[k] = Object.assign({}, raw.metrics[k] || {});
        });
      }
      // legacy
      if (raw && raw.revenue_plan) {
        metrics.revenue = Object.assign(metrics.revenue || {}, raw.revenue_plan);
      }
      if (CFG && CFG.yaml_fallback && (!raw || !raw.metrics) && !raw?.revenue_plan) {
        metrics.revenue = Object.assign({}, CFG.yaml_fallback);
      } else if (CFG && CFG.yaml_fallback && Object.keys(metrics.revenue || {}).length === 0) {
        metrics.revenue = Object.assign({}, CFG.yaml_fallback);
      }

      const listed = Array.isArray(raw && raw.undefined_metrics) ? raw.undefined_metrics : null;
      if (listed) {
        listed.forEach(k => undef.add(k));
      } else {
        // новый месяц: всё кроме выручки — «не определён», пока не задали
        allMetricKeys().forEach(k => {
          if (k === "revenue") return;
          const vals = Object.values(metrics[k] || {});
          const has = vals.some(v => v != null && v !== "");
          if (!has) undef.add(k);
        });
      }
      return { metrics, undefined_metrics: [...undef] };
    }

    function renderForm(state) {
      const host = document.getElementById("sections");
      host.innerHTML = "";
      const undef = new Set(state.undefined_metrics || []);
      SECTIONS.forEach(sec => {
        const box = document.createElement("div");
        box.className = "sec";
        box.innerHTML = "<h3>" + sec.title + "</h3>";
        sec.metrics.forEach(m => {
          const isUndef = undef.has(m.key);
          const block = document.createElement("div");
          block.className = "metric" + (isUndef ? " undef" : "");
          block.dataset.key = m.key;
          const head = document.createElement("div");
          head.className = "metric-head";
          head.innerHTML =
            '<div class="lab">' + m.label + '</div>' +
            '<label class="chk"><input type="checkbox" data-undef="' + m.key + '"' +
            (isUndef ? " checked" : "") + ' /> План не определён</label>';
          block.appendChild(head);
          const mgrs = document.createElement("div");
          mgrs.className = "mgrs";
          (CFG.managers || []).forEach(mgr => {
            const key = mgr.rnp_key;
            const row = document.createElement("div");
            row.className = "mgr";
            const val = (state.metrics[m.key] || {})[key];
            row.innerHTML =
              '<div class="name">' + key + '</div>' +
              '<input type="number" min="0" step="' + (m.kind === "money" ? "1000" : "1") +
              '" data-metric="' + m.key + '" data-mgr="' + key + '" value="' +
              (val == null || val === "" ? "" : val) + '"' +
              (isUndef ? " disabled" : "") + " />";
            mgrs.appendChild(row);
          });
          block.appendChild(mgrs);
          box.appendChild(block);
        });
        host.appendChild(box);
      });

      host.querySelectorAll("input[data-undef]").forEach(chk => {
        chk.addEventListener("change", () => {
          const key = chk.getAttribute("data-undef");
          const block = host.querySelector('.metric[data-key="' + key + '"]');
          const on = chk.checked;
          if (block) block.classList.toggle("undef", on);
          host.querySelectorAll('input[data-metric="' + key + '"]').forEach(inp => {
            inp.disabled = on;
          });
        });
      });
    }

    function collectState() {
      const metrics = {};
      const undefined_metrics = [];
      allMetricKeys().forEach(k => { metrics[k] = {}; });
      document.querySelectorAll("input[data-undef]").forEach(chk => {
        if (chk.checked) undefined_metrics.push(chk.getAttribute("data-undef"));
      });
      const undef = new Set(undefined_metrics);
      document.querySelectorAll("input[data-metric]").forEach(inp => {
        const mk = inp.dataset.metric;
        const mgr = inp.dataset.mgr;
        if (undef.has(mk)) return;
        if (inp.value === "") return;
        metrics[mk][mgr] = Number(inp.value);
      });
      // убрать пустые объекты метрик
      Object.keys(metrics).forEach(k => {
        if (!Object.keys(metrics[k]).length) delete metrics[k];
      });
      return { metrics, undefined_metrics };
    }

    function ghHeaders() {
      return {
        "Authorization": "Bearer " + CFG.token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      };
    }

    function decodeGitContent(b64text) {
      const clean = String(b64text || "").replace(/\s/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    async function unlock(password) {
      const key = await deriveKey(password, b64(SALT_B64));
      const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV_B64) }, key, b64(DATA_B64));
      CFG = JSON.parse(new TextDecoder().decode(plain));
      if (!CFG) throw new Error("bad config");
      if (CFG.api) {
        /* local / VPS hub */
      } else if (!CFG.token || !CFG.repo) {
        throw new Error("bad config");
      }
      PASS = password;
      NW = new Set(CFG.non_working_dates || []);
      const now = new Date();
      const ym = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      document.getElementById("month").value = ym;
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      await loadMonth();
    }

    async function loadMonth() {
      const msg = document.getElementById("msg");
      const btn = document.getElementById("reload");
      msg.className = "msg";
      if (!CFG) { show(msg, "Сначала введите пароль", false); return; }
      const ym = document.getElementById("month").value;
      if (!ym) { show(msg, "Выберите месяц", false); return; }
      const wd = workDays(ym);
      let raw = null;
      let source = "new";
      let updated = "—";
      btn.disabled = true;
      const prevLabel = btn.textContent;
      btn.textContent = "Загрузка…";
      try {
        if (CFG.api) {
          const r = await fetch(CFG.api.replace(/\/$/, "") + "/api/month", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: PASS, month: ym })
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.detail || j.message || ("HTTP " + r.status));
          raw = {
            metrics: j.metrics || {},
            undefined_metrics: j.undefined_metrics || [],
            revenue_plan: j.revenue_plan || {},
            updated_at: j.updated_at
          };
          source = j.file_exists ? "file" : "new";
          updated = j.updated_at || "—";
        } else {
          const path = "data/warehouse/plans/" + ym + ".json";
          const r = await fetch(
            "https://api.github.com/repos/" + CFG.repo + "/contents/" + path + "?ref=" + encodeURIComponent(CFG.branch || "main"),
            { headers: ghHeaders() }
          );
          if (r.status === 200) {
            const j = await r.json();
            const text = decodeGitContent(j.content);
            raw = JSON.parse(text);
            source = "file";
            updated = raw.updated_at || "файл есть";
          } else if (r.status === 404) {
            source = "new";
          } else {
            const j = await r.json().catch(() => ({}));
            throw new Error(j.message || ("GitHub " + r.status));
          }
        }
        const state = normalizePlan(raw);
        document.getElementById("meta").innerHTML =
          "<span>Рабочих дней: <strong>" + wd + "</strong></span>" +
          "<span>Источник: <strong>" + source + "</strong></span>" +
          "<span>Обновлено: <strong>" + updated + "</strong></span>";
        renderForm(state);
        show(msg, source === "file"
          ? ("Месяц " + ym + " загружен")
          : ("Месяц " + ym + " — файла ещё нет, показан черновик"), true);
      } catch (e) {
        const m = String(e.message || e);
        show(msg, m.includes("Failed to fetch")
          ? "Сервер не отвечает. Проверьте VPS API / сеть."
          : m, false);
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel || "Загрузить месяц";
      }
    }

    document.getElementById("unlock").onclick = async () => {
      const el = document.getElementById("gate-msg");
      el.className = "msg";
      try {
        await unlock(document.getElementById("password").value);
      } catch (e) {
        show(el, "Неверный пароль", false);
      }
    };
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("unlock").click();
    });
    document.getElementById("reload").addEventListener("click", (e) => {
      e.preventDefault();
      loadMonth();
    });
    document.getElementById("month").addEventListener("change", () => loadMonth());

    document.getElementById("save").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.className = "msg";
      if (!CFG) { show(msg, "Сначала введите пароль", false); return; }
      const ym = document.getElementById("month").value;
      if (!ym) { show(msg, "Выберите месяц", false); return; }
      const state = collectState();
      const payload = {
        month: ym,
        work_days: workDays(ym),
        updated_at: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
        source: CFG.api ? "plans_pages_local" : "plans_pages",
        undefined_metrics: state.undefined_metrics,
        metrics: state.metrics,
        revenue_plan: state.metrics.revenue || {}
      };
      const btn = document.getElementById("save");
      btn.disabled = true; btn.textContent = "Сохранение…";
      try {
        if (CFG.api) {
          const r = await fetch(CFG.api.replace(/\/$/, "") + "/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              password: PASS,
              month: ym,
              metrics: state.metrics,
              undefined_metrics: state.undefined_metrics,
              revenue_plan: state.metrics.revenue || {},
              rebuild: true
            })
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.detail || j.message || ("HTTP " + r.status));
          const pub = j.pipeline && j.pipeline.published ? "Витрина опубликована." : "";
          show(msg, "Готово на сервере:\n" + (j.path || "") + "\n" + pub, true);
        } else {
          const path = "data/warehouse/plans/" + ym + ".json";
          const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2) + "\n")));
          let sha = null;
          const get = await fetch(
            "https://api.github.com/repos/" + CFG.repo + "/contents/" + path + "?ref=" + encodeURIComponent(CFG.branch || "main"),
            { headers: ghHeaders() }
          );
          if (get.status === 200) {
            const gj = await get.json();
            sha = gj.sha;
          } else if (get.status !== 404) {
            const gj = await get.json().catch(() => ({}));
            throw new Error(gj.message || ("GitHub GET " + get.status));
          }
          const body = {
            message: "plans: " + ym,
            content,
            branch: CFG.branch || "main"
          };
          if (sha) body.sha = sha;
          const r = await fetch("https://api.github.com/repos/" + CFG.repo + "/contents/" + path, {
            method: "PUT",
            headers: ghHeaders(),
            body: JSON.stringify(body)
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.message || ("GitHub " + r.status));
          show(msg, "Готово:\n" + path + "\nЧерез пару минут РНП пересоберётся.", true);
        }
        await loadMonth();
      } catch (e) {
        const m = String(e.message || e);
        show(msg, m.includes("Failed to fetch")
          ? "Сервер не отвечает. Проверьте VPS API / сеть."
          : m, false);
      } finally {
        btn.disabled = false; btn.textContent = "Сохранить";
      }
    };
  </script>
