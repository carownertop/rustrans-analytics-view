<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Загрузка 1С · Rustrans</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1c33; --red:#e30613; --muted:#5b6b7c; --line:#d9e0ea; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Montserrat,system-ui,sans-serif; color:var(--navy);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(227,6,19,.10), transparent 55%),
        linear-gradient(165deg, #f7f9fc, #e8eef6 55%, #f3f6fa);
      padding:28px 16px;
    }
    .wrap { width:min(640px,100%); margin:0 auto; }
    h1 { margin:0 0 6px; font-size:24px; font-weight:800; letter-spacing:-.03em; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.45; }
    .card {
      background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px;
      box-shadow:0 16px 40px rgba(11,28,51,.06); margin-bottom:14px;
    }
    .field-label {
      display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--muted); margin:0 0 6px;
    }
    input[type=password], select, button, input[type=file] { font:inherit; }
    input[type=password], select {
      width:100%; border:1px solid #c9d3e0; border-radius:12px; padding:12px 14px;
      margin-bottom:12px; background:#fbfcfe; font-weight:600;
    }
    input[type=file] {
      width:100%; margin:0 0 12px; padding:10px; border:1px solid #c9d3e0;
      border-radius:12px; background:#fbfcfe;
    }
    button {
      width:100%; border:0; border-radius:12px; padding:13px 18px;
      background:var(--navy); color:#fff; font-weight:700; cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:wait; }
    .msg { margin-top:12px; font-size:13px; font-weight:600; display:none; white-space:pre-wrap; }
    .msg.show { display:block; }
    .msg.ok { color:#1b7f4e; }
    .msg.err { color:var(--red); }
    .hint { font-size:12px; color:var(--muted); line-height:1.45; }
    #gate { display:block; }
    #app { display:none; }
    #fname { margin:0 0 12px; font-size:13px; font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Загрузка 1С</h1>
    <p class="sub">Пароль → выбрать XLSX → отправить. Дубли документов не создаются.</p>

    <div class="card" id="gate">
      <div class="field-label">Пароль</div>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button type="button" id="unlock">Войти</button>
      <div class="msg" id="gate-msg"></div>
    </div>

    <div id="app">
      <div class="card">
        <div class="field-label">Тип выгрузки</div>
        <select id="kind">
          <option value="realizations">Реализации</option>
          <option value="payments">Оплаты</option>
        </select>

        <div class="field-label">Файл Excel (.xlsx)</div>
        <input id="file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
        <div id="fname">Файл не выбран</div>

        <button type="button" id="send">Отправить</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card hint">
        Файл уходит в private-репозиторий. Через 1–3 минуты Actions разберёт его в РНП.
      </div>
    </div>
  </div>

  <script>
    const SALT_B64 = 'GAG7fby3iZ2Yh/HMYBYtXA==';
    const IV_B64 = 's7wBaBqRBH6bvjxm';
    const DATA_B64 = '8UUuAq/3+G7LxOgLAcc/O3Otsv1y/zyirTZguC6iUCZc/DiMCt6yiNtLgLc4ayO+pH5XJtdOgmXEgRVQnc8s/m3atk24l2QAmBFxV4saC1iI1ZP/WBPABlnl48YR294UX4PE2ILZiv5n6SCzeLGJMzOmKcnOnc2N3zJtU0mlXQuaup6cVUQfko2Z5lQhxekN957y++upQoDBcjutgR30pSH8NVv+KA/gacZZbEMXuvoHCVtan3o=';
    const ITERATIONS = 200000;
    let CFG = null;

    const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt, iterations:ITERATIONS, hash:"SHA-256" },
        base,
        { name:"AES-GCM", length:256 },
        false,
        ["decrypt"]
      );
    }

    async function unlock(password) {
      const key = await deriveKey(password, b64(SALT_B64));
      const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV_B64) }, key, b64(DATA_B64));
      CFG = JSON.parse(new TextDecoder().decode(plain));
      if (!CFG || !CFG.token || !CFG.repo) throw new Error("bad config");
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
    }

    function show(el, text, ok) {
      el.textContent = text;
      el.className = "msg show " + (ok ? "ok" : "err");
    }

    document.getElementById("unlock").onclick = async () => {
      const el = document.getElementById("gate-msg");
      el.className = "msg";
      try {
        await unlock(document.getElementById("password").value);
      } catch (e) {
        show(el, "Неверный пароль", false);
      }
    };
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("unlock").click();
    });

    const fileInput = document.getElementById("file");
    const fname = document.getElementById("fname");
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      fname.textContent = f ? (f.name + " · " + (f.size/1024).toFixed(1) + " КБ") : "Файл не выбран";
    });

    function toB64(bytes) {
      let s = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(s);
    }

    document.getElementById("send").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.className = "msg";
      if (!CFG) { show(msg, "Сначала введите пароль", false); return; }
      const file = fileInput.files && fileInput.files[0];
      if (!file) { show(msg, "Выберите файл .xlsx", false); return; }
      const kind = document.getElementById("kind").value;
      const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/, "Z");
      const safe = file.name.replace(/[^\w.\- ()\u0400-\u04FF]+/g, "_");
      const path = "data/inbox/1c/" + kind + "/" + stamp + "__" + safe;
      const btn = document.getElementById("send");
      btn.disabled = true; btn.textContent = "Отправка…";
      try {
        const buf = new Uint8Array(await file.arrayBuffer());
        if (buf.byteLength > 25 * 1024 * 1024) throw new Error("Файл больше 25 МБ");
        const body = {
          message: "upload(1c): " + safe,
          content: toB64(buf),
          branch: CFG.branch || "main"
        };
        const r = await fetch("https://api.github.com/repos/" + CFG.repo + "/contents/" + path, {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + CFG.token,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify(body)
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || ("GitHub " + r.status));
        show(msg, "Готово:\n" + path + "\nЧерез пару минут данные в РНП.", true);
        fileInput.value = "";
        fname.textContent = "Файл не выбран";
      } catch (e) {
        show(msg, String(e.message || e), false);
      } finally {
        btn.disabled = false; btn.textContent = "Отправить";
      }
    };
  </script>
</body>
</html>
