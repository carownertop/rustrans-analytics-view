<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Загрузка 1С · Rustrans</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0b1c33; --red:#e30613; --muted:#5b6b7c; --line:#d9e0ea; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Montserrat,system-ui,sans-serif; color:var(--navy);
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(227,6,19,.10), transparent 55%),
        linear-gradient(165deg, #f7f9fc, #e8eef6 55%, #f3f6fa);
      padding:28px 16px;
    }
    .wrap { width:min(640px,100%); margin:0 auto; }
    h1 { margin:0 0 6px; font-size:24px; font-weight:800; letter-spacing:-.03em; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.45; }
    .card {
      background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px;
      box-sizing:border-box; box-shadow:0 16px 40px rgba(11,28,51,.06); margin-bottom:14px;
    }
    .field-label {
      display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--muted); margin:0 0 6px;
    }
    input[type=password], select, button, input[type=file] { font:inherit; }
    input[type=password], select {
      width:100%; border:1px solid #c9d3e0; border-radius:12px; padding:12px 14px;
      margin-bottom:12px; background:#fbfcfe; font-weight:600;
    }
    input[type=file] {
      width:100%; margin:0 0 12px; padding:10px; border:1px solid #c9d3e0;
      border-radius:12px; background:#fbfcfe;
    }
    button {
      width:100%; border:0; border-radius:12px; padding:13px 18px;
      background:var(--navy); color:#fff; font-weight:700; cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:wait; }
    .msg { margin-top:12px; font-size:13px; font-weight:600; display:none; white-space:pre-wrap; }
    .msg.show { display:block; }
    .msg.ok { color:#1b7f4e; }
    .msg.err { color:var(--red); }
    .hint { font-size:12px; color:var(--muted); line-height:1.45; }
    #gate { display:block; }
    #app { display:none; }
    #fname { margin:0 0 12px; font-size:13px; font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Загрузка 1С</h1>
    <p class="sub">Пароль → выбрать XLSX → на сервер. Разбор и публикация витрины на GitHub — на VPS.</p>

    <div class="card" id="gate">
      <div class="field-label">Пароль</div>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button type="button" id="unlock">Войти</button>
      <div class="msg" id="gate-msg"></div>
    </div>

    <div id="app">
      <div class="card">
        <div class="field-label">Тип выгрузки</div>
        <select id="kind">
          <option value="realizations">Реализации</option>
          <option value="payments">Оплаты</option>
        </select>

        <div class="field-label">Файл Excel (.xlsx)</div>
        <input id="file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats.spreadsheetml.sheet" />
        <div id="fname">Файл не выбран</div>

        <button type="button" id="send">Отправить на сервер</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card hint">
        Форма на GitHub Pages шлёт файл на VPS (<code>/u</code>). После разбора витрина публикуется сюда же.
      </div>
    </div>
  </div>

  <script>
    const BLOBS = [{"salt": "UxIctebP6od1vxXj89A3Zw==", "iv": "0LcsasRgHwYZ9Uml", "data": "ZBje3pOpICgb2yaDiY8CS3Lepy1OnyrMe2Mpb60okPj+jVY9JICy90F+ZZiGfSaFFf+3WZfM8gz7By02259QT6gRiZ/I4W9BP7xuhGFsXokj", "cookie": "rtl_manage_pw"}, {"salt": "SY8KmIWCToOX28qpP9w5cA==", "iv": "e5mYWao3PmCKLtvn", "data": "re6QmBIfhuO4AJqSXBdWS7wOFUmElYPuIwZsxpK85d7VwSMjwOC46hA8sGPYqt5UmpX33PY/JWyaKrgZj0bH0kFhs3B/6Hif91Sm29DSUFtX", "cookie": "rtl_hub_pw"}];
    const ITERATIONS = 200000;
    let CFG = null;
    let PASS = "";
    const REMEMBER_DAYS = 7;
    const PW_COOKIES = ["rtl_manage_pw", "rtl_hub_pw"];

    function setPwCookie(pw, cookieName) {
      const maxAge = REMEMBER_DAYS * 24 * 60 * 60;
      const secure = location.protocol === "https:" ? "; Secure" : "";
      document.cookie = cookieName + "=" + encodeURIComponent(pw)
        + "; Max-Age=" + maxAge + "; Path=/; SameSite=Lax" + secure;
    }
    function getPwCookie(name) {
      const parts = document.cookie.split(";");
      for (const raw of parts) {
        const p = raw.trim();
        if (p.startsWith(name + "=")) return decodeURIComponent(p.slice(name.length + 1));
      }
      return "";
    }
    function clearPwCookies() {
      PW_COOKIES.forEach(name => {
        document.cookie = name + "=; Max-Age=0; Path=/; SameSite=Lax";
      });
    }

    const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt, iterations:ITERATIONS, hash:"SHA-256" },
        base,
        { name:"AES-GCM", length:256 },
        false,
        ["decrypt"]
      );
    }

    async function unlock(password) {
      let lastErr = null;
      for (const blob of BLOBS) {
        try {
          const key = await deriveKey(password, b64(blob.salt));
          const plain = await crypto.subtle.decrypt(
            { name:"AES-GCM", iv:b64(blob.iv) }, key, b64(blob.data)
          );
          CFG = JSON.parse(new TextDecoder().decode(plain));
          if (!CFG || !CFG.api) throw new Error("bad config");
          PASS = password;
          const cookieName = blob.cookie || "rtl_manage_pw";
          setPwCookie(password, cookieName);
          document.getElementById("gate").style.display = "none";
          document.getElementById("app").style.display = "block";
          return;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("bad password");
    }

    function show(el, text, ok) {
      el.textContent = text;
      el.className = "msg show " + (ok ? "ok" : "err");
    }

    document.getElementById("unlock").onclick = async () => {
      const el = document.getElementById("gate-msg");
      el.className = "msg";
      try {
        await unlock(document.getElementById("password").value);
      } catch (e) {
        clearPwCookies();
        show(el, "Неверный пароль", false);
      }
    };
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("unlock").click();
    });

    (async () => {
      for (const name of PW_COOKIES) {
        const saved = getPwCookie(name);
        if (!saved) continue;
        try { await unlock(saved); return; } catch (e) { /* try next */ }
      }
    })();

    const fileInput = document.getElementById("file");
    const fname = document.getElementById("fname");
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      fname.textContent = f ? (f.name + " · " + (f.size/1024).toFixed(1) + " КБ") : "Файл не выбран";
    });

    document.getElementById("send").onclick = async () => {
      const msg = document.getElementById("msg");
      msg.className = "msg";
      if (!CFG) { show(msg, "Сначала введите пароль", false); return; }
      const file = fileInput.files && fileInput.files[0];
      if (!file) { show(msg, "Выберите файл .xlsx", false); return; }
      const kind = document.getElementById("kind").value;
      const btn = document.getElementById("send");
      btn.disabled = true; btn.textContent = "Отправка…";
      try {
        if (file.size > 25 * 1024 * 1024) throw new Error("Файл больше 25 МБ");
        const fd = new FormData();
        fd.append("password", PASS);
        fd.append("kind", kind);
        fd.append("file", file, file.name);
        const r = await fetch(CFG.api.replace(/\/$/, "") + "/api/upload", { method: "POST", body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || j.message || ("HTTP " + r.status));
        show(msg, "Готово на сервере:\n" + (j.path || "") + "\n" + (j.hint || ""), true);
        fileInput.value = "";
        fname.textContent = "Файл не выбран";
      } catch (e) {
        const m = String(e.message || e);
        show(msg, m.includes("Failed to fetch")
          ? "Сервер не отвечает. Проверьте VPS API / сеть."
          : m, false);
      } finally {
        btn.disabled = false; btn.textContent = "Отправить на сервер";
      }
    };
  </script>
</body>
</html>
